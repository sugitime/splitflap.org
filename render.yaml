# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard and apply the blueprint,
# or use "New > Blueprint" and point at this file.
#
# Production: splitflap  — branch main; AUTO-DEPLOY OFF (manual only)
# UAT:        splitflap-uat — branch uat only; auto-deploy on
# Never push/deploy UAT work to production.

services:
  - type: web
    name: splitflap
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: MODERATOR_USERNAME
        value: moderator
      # Set in the Render dashboard / API — do not commit production secrets.
      - key: MODERATOR_PASSWORD
        sync: false
      - key: PUBLIC_DISPLAY_MS
        value: "20000"

  - type: web
    name: splitflap-uat
    runtime: docker
    branch: uat
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: uat
      - key: MODERATOR_USERNAME
        value: moderator
      - key: MODERATOR_PASSWORD
        sync: false
      - key: PUBLIC_DISPLAY_MS
        value: "20000"